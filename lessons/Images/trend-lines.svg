<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="sans-serif">
  <rect x="0" y="0" width="620" height="340" fill="#ffffff" />

  <!-- axes -->
  <line x1="50" y1="20" x2="50" y2="260" stroke="#333" stroke-width="1.5" />
  <line x1="50" y1="260" x2="590" y2="260" stroke="#333" stroke-width="1.5" />
  <text x="30" y="18" font-size="13" fill="#333">y</text>
  <text x="590" y="280" font-size="13" fill="#333">x</text>

  <!-- moving average: follows local shape, lags/smooths -->
  <polyline
    points="60,215 100,210 140,205 180,195 220,185 260,180 300,170 340,160 380,155 420,145 460,130 500,120 540,105"
    fill="none" stroke="#1f77b4" stroke-width="3" stroke-linejoin="round" />

  <!-- linear regression: single straight best-fit line -->
  <line x1="60" y1="216" x2="540" y2="98" stroke="#d62728" stroke-width="3" stroke-dasharray="8 5" />

  <!-- noisy scatter data -->
  <g fill="#888888">
    <circle cx="60" cy="220" r="5" />
    <circle cx="100" cy="200" r="5" />
    <circle cx="140" cy="230" r="5" />
    <circle cx="180" cy="190" r="5" />
    <circle cx="220" cy="170" r="5" />
    <circle cx="260" cy="195" r="5" />
    <circle cx="300" cy="160" r="5" />
    <circle cx="340" cy="150" r="5" />
    <circle cx="380" cy="175" r="5" />
    <circle cx="420" cy="130" r="5" />
    <circle cx="460" cy="140" r="5" />
    <circle cx="500" cy="110" r="5" />
    <circle cx="540" cy="100" r="5" />
  </g>

  <!-- legend -->
  <g font-size="14" fill="#333">
    <circle cx="90" cy="300" r="5" fill="#888888" />
    <text x="102" y="305">data</text>

    <line x1="220" y1="300" x2="250" y2="300" stroke="#1f77b4" stroke-width="3" />
    <text x="258" y="305">moving average</text>

    <line x1="420" y1="300" x2="450" y2="300" stroke="#d62728" stroke-width="3" stroke-dasharray="8 5" />
    <text x="458" y="305">linear regression</text>
  </g>
</svg>
